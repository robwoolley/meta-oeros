#
# Required by kd240-bist and kr260-tsn-rs485pmod overlays
# (microchip,mcp25625 SPI-CAN transceiver on PMOD).
CONFIG_CAN_MCP251X=m
# Useful companion for canopen / ROS2 ros2_canopen testing without
# real hardware; pulled into the foc-motor-ctrl ROS2 client container.
CONFIG_CAN_VCAN=m
# Required by the kr260-pmod-gps overlay (pps-gpio compatible).
CONFIG_PPS_CLIENT_GPIO=m
# 1-Wire thermal slave (DS18B20-style) hung off the amd_axi_w1 master on
# the kd240-motor-ctrl-qei overlay; exposes a hwmon temp input that
# lm-sensors reads in the foc-motor-ctrl server container.
CONFIG_W1_SLAVE_THERM=m
