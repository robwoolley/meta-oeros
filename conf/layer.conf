# We have a conf and classes directory, add to BBPATH
BBPATH =. "${LAYERDIR}:"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "oeros"
BBFILE_PATTERN_oeros = "^${LAYERDIR}/"
BBFILE_PRIORITY_oeros = "5"

LAYERSERIES_COMPAT_oeros = "wrynose"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_oeros = "3"

LAYERDEPENDS_oeros = " \
    core \
    openembedded-layer \
    meta-python \
    virtualization-layer \
    ros-common-layer \
    ros2-layer \
    ros2-lyrical-layer \
"

# bbappends for recipes from optional layers live under dynamic-layers/ and
# are only parsed when that layer is present
BBFILES_DYNAMIC += " \
    qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/*/*/*.bb \
    qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/*/*/*.bbappend \
"

# Edge AI vendor packagegroups only parse when the matching vendor layer is
# present in BBLAYERS. Keys are each vendor layer's BBFILE_COLLECTIONS value
# on wrynose -- verified against each layer's own conf/layer.conf:
#   meta-tegra -> tegra, meta-imx-ml -> imx-machine-learning, meta-qcom -> qcom,
#   meta-edgeai -> meta-edgeai, meta-intel -> intel,
#   meta-xilinx/meta-xilinx-core -> xilinx
# AMD/Xilinx: meta-xilinx, meta-kria, meta-amd-adaptive-socs and meta-vitis
# all have a wrynose-compatible rel-v2026.2 branch, so the Kria/Versal
# packagegroup lives here. It is only reachable from the separate
# oeros-wrynose-lyrical-amd bitbake-setup config (see docs/amd-xilinx.md);
# meta-xilinx-tools is still not on wrynose and is not needed (SDT flow).
BBFILES_DYNAMIC += " \
    tegra:${LAYERDIR}/dynamic-layers/tegra/recipes-*/*/*.bb \
    imx-machine-learning:${LAYERDIR}/dynamic-layers/imx/recipes-*/*/*.bb \
    qcom:${LAYERDIR}/dynamic-layers/qcom/recipes-*/*/*.bb \
    meta-edgeai:${LAYERDIR}/dynamic-layers/ti/recipes-*/*/*.bb \
    intel:${LAYERDIR}/dynamic-layers/intel/recipes-*/*/*.bb \
    xilinx:${LAYERDIR}/dynamic-layers/xilinx/recipes-*/*/*.bb \
    xilinx:${LAYERDIR}/dynamic-layers/xilinx/recipes-*/*/*.bbappend \
    xilinx-multimedia:${LAYERDIR}/dynamic-layers/xilinx-multimedia/recipes-*/*/*.bbappend \
    meta-onnxruntime:${LAYERDIR}/dynamic-layers/meta-onnxruntime/recipes-*/*/*.bbappend \
"

# Vendor selector; set by conf/machine/include/oeros-edgeai-<vendor>.inc
OEROS_EDGEAI_VENDOR ?= ""
