# We have a conf and classes directory, add to BBPATH
BBPATH =. "${LAYERDIR}:"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "oeros"
BBFILE_PATTERN_oeros = "^${LAYERDIR}/"
BBFILE_PRIORITY_oeros = "5"

LAYERSERIES_COMPAT_oeros = "wrynose"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_oeros = "3"

LAYERDEPENDS_oeros = "core openembedded-layer meta-python virtualization-layer"

# Edge AI vendor packagegroups only parse when the matching vendor layer is
# present in BBLAYERS. Keys are each vendor layer's BBFILE_COLLECTIONS value
# on wrynose -- verified against each layer's own conf/layer.conf:
#   meta-tegra -> tegra, meta-imx-ml -> imx-machine-learning, meta-qcom -> qcom,
#   meta-edgeai -> meta-edgeai, meta-intel -> intel
# AMD/Xilinx (meta-xilinx-tools, meta-vitis-ai, meta-kria) are intentionally
# left out: those layers have no branch past scarthgap, so the Kria/Versal
# edgeai packagegroup lives on feature/edgeai-amd-xilinx-lag instead.
BBFILES_DYNAMIC += " \
    tegra:${LAYERDIR}/dynamic-layers/tegra/recipes-*/*/*.bb \
    imx-machine-learning:${LAYERDIR}/dynamic-layers/imx/recipes-*/*/*.bb \
    qcom:${LAYERDIR}/dynamic-layers/qcom/recipes-*/*/*.bb \
    meta-edgeai:${LAYERDIR}/dynamic-layers/ti/recipes-*/*/*.bb \
    intel:${LAYERDIR}/dynamic-layers/intel/recipes-*/*/*.bb \
"

# Vendor selector; set by conf/machine/include/oeros-edgeai-<vendor>.inc
OEROS_EDGEAI_VENDOR ?= ""
