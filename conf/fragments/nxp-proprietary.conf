BB_CONF_FRAGMENT_SUMMARY = "Opt in to the NXP EULA (required to build i.MX boards)"
BB_CONF_FRAGMENT_DESCRIPTION = "Accept the Freescale/NXP EULA and the \
'commercial' license flag. Unlike the other vendors this is not optional \
for i.MX: meta-freescale's fsl-eula-unpack class stops the build \
(bb.fatal) for any EULA-covered recipe, which includes the DDR/boot \
firmware every i.MX image needs. See docs/edgeai.md, 'Proprietary opt-in'. \
"

# meta-freescale's own fragment (conf/fragments/eula/accept-fsl-eula.conf):
# sets ACCEPT_FSL_EULA = "1". This used to be set unconditionally in
# oeros-edgeai-imx.inc.
require conf/fragments/eula/accept-fsl-eula.conf

# meta-freescale / meta-imx-bsp gstreamer1.0-libav and -plugins-ugly
LICENSE_FLAGS_ACCEPTED:append = " commercial"

MACHINE_FEATURES:append = " edgeai-nxp-proprietary"
