BB_CONF_FRAGMENT_SUMMARY = "Opt in to AMD/Xilinx proprietary firmware and drivers"
BB_CONF_FRAGMENT_DESCRIPTION = "Opt in to AMD/Xilinx proprietary firmware \
and drivers on the oeros/machine-<amd board> targets. By enabling this \
fragment you accept the AMD/Xilinx license terms of: \
  - VCU / VCU2 video codec firmware (vcu-firmware, vcu2-firmware) \
  - the Arm Mali userspace driver (libmali-xlnx, replaces Mesa Lima/llvmpipe) \
  - the Kria starter-kit PL firmware bundles (k26-starter-kits, k24-starter-kits) \
  - the ZynqMP PMU ROM used only for QEMU emulation (pmu-rom-native) \
  - the GStreamer omx/libav/ugly plugins that AMD's VCU pipeline needs \
See docs/amd-xilinx.md for the full list and what each one unlocks. \
"

# 'xilinx'     -> pmu-rom-native (QEMU boot of ZynqMP; also silences the
#                 meta-xilinx-core xilinx-vars.bbclass warning)
# 'commercial' -> gstreamer1.0-omx / -libav / -plugins-ugly from
#                 meta-xilinx-multimedia (VCU OpenMAX pipeline)
LICENSE_FLAGS_ACCEPTED:append = " xilinx commercial"

# meta-xilinx-mali400 / meta-xilinx-gpu-malig78ae select libmali-xlnx over
# Mesa when this DISTRO_FEATURE is set (Kria: Lima is the open default;
# VEK385 Mali-G78AE: Mesa has no driver, so without this it is CPU-rendered).
DISTRO_FEATURES:append = " libmali"

# Read by packagegroup-oeros-edgeai-xilinx to add its -proprietary
# sub-package (VCU/VCU2 stack, Kria starter-kit firmware via packagegroup-kria).
MACHINE_FEATURES:append = " edgeai-amd-proprietary"
