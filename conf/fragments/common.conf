BB_CONF_FRAGMENT_SUMMARY = "Always-on oeros baseline: usrmerge, dev-friendly image features, rm_work"
BB_CONF_FRAGMENT_DESCRIPTION = "Always-on oeros baseline \
  - Enables the usrmerge DISTRO_FEATURE. \
  - Adds empty-root-password, allow-empty-password, allow-root-login, and post-install-logging \
    IMAGE_FEATURES. \
  - Inherits report-error and rm_work. \
  - Removes create-spdx from INHERIT_DISTRO. \
  - Every matrix cell enables this fragment; it is the fragment equivalent of \
    kas/common.yml's local_conf_header, minus TEMPLATECONF (a kas-specific setting with no \
    meaning outside the kas entry path -- see docs/kas-to-fragments-migration-spec.md section 1.6). \
"

DISTRO_FEATURES += "usrmerge"
IMAGE_FEATURES += "empty-root-password allow-empty-password allow-root-login post-install-logging"
INHERIT += "report-error"
INHERIT += "rm_work"
INHERIT_DISTRO:remove = "create-spdx"
