BB_CONF_FRAGMENT_SUMMARY = "Stop or halt the build when the build host is low on disk space"
BB_CONF_FRAGMENT_DESCRIPTION = "Stop or halt the build when the build host is low on disk space \
  - Sets BB_DISKMON_DIRS to stop starting new tasks below 1G free on TMPDIR/DL_DIR/SSTATE_DIR/tmp, \
    and to halt the build outright below 100M/10M. \
"

BB_DISKMON_DIRS ?= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"
