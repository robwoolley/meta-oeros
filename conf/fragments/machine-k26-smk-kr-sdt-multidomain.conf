MACHINE = "k26-smk-kr-sdt-multidomain"
require conf/machine/include/oeros-edgeai-xilinx.inc
require conf/fragments/ros-lyrical.conf
require conf/fragments/edgeai.conf
# AMP / multidomain: Linux on the APU plus FreeRTOS, bare-metal or Zephyr on
# the RPU (Cortex-R5F / R52), connected over OpenAMP RPMsg. meta-xilinx's
# packagegroup-openamp requires the 'openamp' DISTRO_FEATURE.
DISTRO_FEATURES:append = " openamp"
MACHINE_FEATURES:append = " edgeai-openamp"
BB_CONF_FRAGMENT_SUMMARY = "MACHINE k26-smk-kr-sdt-multidomain (AMD Kria KR260 Robotics Starter Kit, AMP) with xilinx Edge AI stack + OpenAMP"
BB_CONF_FRAGMENT_DESCRIPTION = "MACHINE k26-smk-kr-sdt-multidomain (AMD Kria KR260 Robotics Starter Kit, AMP) with xilinx Edge AI stack and OpenAMP RPMsg to the real-time cores."
