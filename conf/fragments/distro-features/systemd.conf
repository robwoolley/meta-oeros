BB_CONF_FRAGMENT_SUMMARY = "Use systemd as the init manager"
BB_CONF_FRAGMENT_DESCRIPTION = "Use systemd as the init manager \
  - Enables the systemd and pam DISTRO_FEATURES, selects systemd as the init manager, and opts sysvinit \
    out of the default DISTRO_FEATURES backfill. \
  - Also builds systemd with networkd support so it is available as a network manager; it is not enabled \
    by default here, that is left to the image or a further fragment. \
"

DISTRO_FEATURES += " pam systemd"
DISTRO_FEATURES_OPTED_OUT += "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"

PACKAGECONFIG:append:pn-systemd = " networkd"
