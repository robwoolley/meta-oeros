BB_CONF_FRAGMENT_SUMMARY = "Enable the graphics stack needed for visualization tools (rviz2, gazebo, etc.)"
BB_CONF_FRAGMENT_DESCRIPTION = "Enable the graphics stack needed for visualization tools \
  - Adds x11, opengl, vulkan, and polkit DISTRO_FEATURES, and builds python3 with tk support. \
  - Requires the oeros/license/allow-commercial-licenses fragment, since the commercial graphics \
    drivers pulled in on some machines need LICENSE_FLAGS_ACCEPTED to include \"commercial\". \
"

DISTRO_FEATURES:append = " x11 opengl vulkan polkit"
PACKAGECONFIG:append:pn-python3 = " tk"
