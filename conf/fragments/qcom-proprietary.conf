# meta-qcom itself declares no LICENSE_FLAGS; 'commercial' is for the
# GStreamer libav/ugly codecs meta-qcom-distro's images pull in when it is
# accepted. This used to be set unconditionally in oeros-edgeai-qcom.inc.
LICENSE_FLAGS_ACCEPTED:append = " commercial"

# Read by packagegroup-oeros-edgeai-qcom to include -runtime, -dev and the
# proprietary-dependent part of -robotics.
MACHINE_FEATURES:append = " edgeai-qcom-proprietary"
