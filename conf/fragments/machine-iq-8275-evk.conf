MACHINE = "iq-8275-evk"
require conf/machine/include/oeros-edgeai-qcom.inc
MACHINE_FEATURES:append = " edgeai-robotics-sdk"
require conf/fragments/ros-jazzy.conf
require conf/fragments/edgeai.conf
BB_CONF_FRAGMENT_SUMMARY = "MACHINE iq-8275-evk with qcom Edge AI + QIR robotics SDK stack"
BB_CONF_FRAGMENT_DESCRIPTION = "MACHINE iq-8275-evk with qcom Edge AI + QIR robotics SDK stack."

# The QIR SDK (meta-qcom-robotics-sdk) needs these Jazzy recipes that meta-ros
# skips when ROS_WORLD_SKIP_GROUPS has qt5/x11/opengl/libomp. Its own CI patches
# the same lines out of meta-ros2-jazzy's ros-distro-recipe-blacklist.inc
# (patches/0003-jazzy-move-some-nav2-and-moveit-packages-out-of-blac.patch);
# clearing the flags here does the same without patching meta-ros. Set from the
# fragment, so these assignments come before the distro's weak (?=) defaults.
SKIP_RECIPE[moveit-planners] = ""
SKIP_RECIPE[moveit-planners-ompl] = ""
SKIP_RECIPE[moveit-ros-perception] = ""
SKIP_RECIPE[moveit-runtime] = ""
SKIP_RECIPE[nav2-bringup] = ""
SKIP_RECIPE[navigation2] = ""

# meta-qcom-robotics-sdk's lapack bbappend adds PROVIDES += "openblas" so that
# meta-oe's lapack can stand in for it. Oeros configs always include
# meta-python-ai's real openblas recipe, so both end up in the build and
# bitbake stops with "Multiple .bb files ... provide openblas". Mask the
# bbappend; meta-python-ai's own lapack bbappend builds lapack on openblas.
BBMASK += "meta-qcom-robotics-sdk/recipes-bbappends/recipe-ros/lapack/"

# rviz2 and its libraries are skipped in meta-ros2-jazzy (Qt and OpenGL
# groups), so vision-msgs-rviz-plugins cannot resolve (packagegroup-oeros-edgeai-ros)
OEROS_RVIZ_PLUGINS = ""
