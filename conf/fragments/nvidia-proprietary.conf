BB_CONF_FRAGMENT_SUMMARY = "Opt in to the Nvidia proprietary Edge AI stack on Jetson"
BB_CONF_FRAGMENT_DESCRIPTION = "Opt in to Nvidia's proprietary Jetson Edge AI \
stack: cuDNN, TensorRT, the nvv4l2/nvarguscamerasrc GStreamer plugins, \
DeepStream (deepstream-9.1, meta-tegra-community) and anything built on \
them. By enabling this fragment you accept the NVIDIA license terms of \
those packages. See docs/edgeai.md, 'Proprietary opt-in'. \
"

# meta-tegra (wrynose) declares no LICENSE_FLAGS of its own: its NVIDIA
# packages are LICENSE = "Proprietary" with no flag gate, so the old
# LICENSE_FLAGS_ACCEPTED "commercial_tegra" in oeros-edgeai-tegra.inc
# matched nothing. 'commercial' is for the FFmpeg/GStreamer codec plugins
# meta-tegra-community enables when it is accepted (DeepStream/VPI
# samples).
LICENSE_FLAGS_ACCEPTED:append = " commercial"

# Read by packagegroup-oeros-edgeai-tegra to include its sub-packages.
MACHINE_FEATURES:append = " edgeai-nvidia-proprietary"
