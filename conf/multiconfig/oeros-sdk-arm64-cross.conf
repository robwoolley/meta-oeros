#
# Cross SDK container targeting generic arm64, hosted on x86-64.
#
# MACHINE and SDKMACHINE deliberately disagree: the toolchain runs on an x86-64
# workstation and emits arm64 binaries.  That mismatch is why this image cannot
# layer onto oeros-container-base -- that rootfs is arm64 and the SDK is not.
# oeros-container-sdk-cross therefore builds from scratch, using the nativesdk
# sysroot inside the SDK as the container's entire userland, and labels itself
# amd64 rather than taking the architecture from TARGET_ARCH.
#
# Build oeros-container-sdk-cross here; oeros-container-sdk-target belongs in
# oeros-sdk-arm64-target.

MACHINE = "genericarm64"
SDKMACHINE = "x86_64"

require conf/include/oeros-container-mc.inc

# oeros-container-sdk-cross unpacks the SDK archive rather than running the
# self-extracting installer.  create_shar appends that archive to the .sh and
# then deletes it, so the shar step has to be off for the archive to survive
# into ${SDK_DEPLOY}.
SDK_PACKAGING_FUNC:pn-ros2-image-sdktest = ""
SDK_ARCHIVE_TYPE:pn-ros2-image-sdktest = "tar.xz"
