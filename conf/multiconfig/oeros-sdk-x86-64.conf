#
# SDK containers whose target is generic x86-64.
#
# SDKMACHINE matches the target architecture here, so the one SDK built in this
# multiconfig serves both roles: run it on an x86-64 workstation as the cross
# SDK, build for an x86-64 target, or run it on the target itself as the
# on-target SDK. oeros-container-sdk-cross and oeros-container-sdk-target are
# both buildable here and differ only in how they are packaged: the cross
# image is a self-contained SDK with no OS around it, the target image layers
# the SDK onto oeros-container-base so the result is a usable shell environment.

MACHINE = "genericx86-64"
SDKMACHINE = "x86_64"

require conf/include/oeros-container-mc.inc

# oeros-container-sdk-cross unpacks the SDK archive rather than running the
# self-extracting installer.  create_shar appends that archive to the .sh and
# then deletes it, so the shar step has to be off for the archive to survive
# into ${SDK_DEPLOY}.
SDK_PACKAGING_FUNC:pn-ros2-image-sdktest = ""
SDK_ARCHIVE_TYPE:pn-ros2-image-sdktest = "tar.xz"
