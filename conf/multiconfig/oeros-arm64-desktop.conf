#
# Graphical and simulation container images for generic arm64 (SystemReady IR/ES) hosts.
#
# Separate from oeros-arm64 for two reasons, both of which would otherwise
# leak into the small runtime images:
#
#   * LICENSE_FLAGS_ACCEPTED.  perception, simulation and desktop-full pull in
#     components with commercial license flags.  Accepting those globally would
#     also let one slip into ros-core, which is meant to stay redistributable
#     without review.
#
#   * x11.  oeros.conf ships a wayland/opengl/vulkan desktop, but rocker's
#     --x11 extension is X11-specific: it runs xauth inside the container and
#     bind-mounts /tmp/.X11-unix.  rviz2 under rocker therefore needs the X11
#     client libraries, which only get built when x11 is a DISTRO_FEATURE.
#     This changes the signature of a large number of recipes, which is the
#     main reason it is confined to this multiconfig.

MACHINE = "genericarm64"

require conf/include/oeros-container-mc.inc
require conf/fragments/allow-commercial-licenses.conf

DISTRO_FEATURES:append = " x11"

# Both of the heavy hitters in this multiconfig -- gz-sim-vendor's Qt/QML
# translation units and moveit -- have driven this build host into swap
# exhaustion when several of their compiler processes overlap.  BB_NUMBER_THREADS
# in local.conf caps how many recipes run at once; this caps how wide each of
# these individual recipes may go regardless of that setting.
PARALLEL_MAKE:pn-gz-sim-vendor = "-j 1"
PARALLEL_MAKE:pn-gz-rendering-vendor = "-j 1"
PARALLEL_MAKE:pn-gz-gui-vendor = "-j 1"
PARALLEL_MAKE:pn-gz-ogre-next-vendor = "-j 1"
PARALLEL_MAKE:pn-moveit = "-j 1"
PARALLEL_MAKE:pn-moveit-core = "-j 1"
PARALLEL_MAKE:pn-rviz2 = "-j 1"
