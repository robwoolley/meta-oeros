#
# On-target arm64 SDK container: the compiler runs on the arm64 target itself.
#
# SDKMACHINE matches MACHINE, so the SDK and the container rootfs are the same
# architecture and oeros-container-sdk-target can layer the toolchain onto
# oeros-container-base.  Build oeros-container-sdk-target here.

MACHINE = "genericarm64"
SDKMACHINE = "aarch64"

require conf/include/oeros-container-mc.inc

# oeros-container-sdk-cross unpacks the SDK archive rather than running the
# self-extracting installer.  create_shar appends that archive to the .sh and
# then deletes it, so the shar step has to be off for the archive to survive
# into ${SDK_DEPLOY}.
SDK_PACKAGING_FUNC:pn-ros2-image-sdktest = ""
SDK_ARCHIVE_TYPE:pn-ros2-image-sdktest = "tar.xz"
